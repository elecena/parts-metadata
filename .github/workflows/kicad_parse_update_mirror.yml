name: Update kicad-parser files from GitLab

on:
  schedule:
    # run daily
    - cron:  '7 5 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # For testing purposes
  # pull_request:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Update files from kicad-parser
      working-directory: kicad_parser
      run: ./update_mirror.sh

    - name: Show diff
      working-directory: kicad_parser
      run: git diff

    - name: Commit the changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        # https://github.com/stefanzweifel/git-auto-commit-action
        commit_message: "kicad_parser GitLab repo changes"
        # Optional. Remote branch name where commit is going to be pushed to. 
        # Defaults to the current branch.
        branch: update/kicad_parser
        # Optional. Create given branch name in local and remote repository.
        create_branch: true

    - name: Create a pull request
      env:
        # gh: To use GitHub CLI in a GitHub Actions workflow, set the GH_TOKEN environment variable
        # Using PAT token to be able to auto-merge pull requests from here
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        set -x
        gh pr create --head update/kicad_parser --title 'kicad_parser GitLab repo changes' --body 'See https://gitlab.com/kicad/libraries/kicad-library-utils' --assignee macbre \
          && gh pr merge --auto --squash update/kicad_parser || true
